<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Personal Bot</title>
<style>
  :root {
    --surface-1: #1a1a19; --page-plane: #0d0d0d; --text-primary: #fff;
    --text-secondary: #c3c2b7; --text-muted: #898781; --border: rgba(255,255,255,0.1);
    --accent: #2a78d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane); color: var(--text-primary);
    display: flex; flex-direction: column; height: 100vh;
  }
  header { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 70%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.assistant { align-self: flex-start; background: var(--surface-1); border: 1px solid var(--border); color: var(--text-primary); }
  .msg.pending { color: var(--text-muted); font-style: italic; }
  .msg.error { align-self: flex-start; background: #3a1f1f; border: 1px solid #e34948; color: #f3b6b5; }
  form { display: flex; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--border); }
  input[type="text"] {
    flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-size: 14px;
  }
  button { padding: 10px 18px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>
<header><h1>Personal Bot</h1></header>
<div id="chat"></div>
<form id="chatForm">
  <input type="text" id="input" placeholder="Type a message…" autocomplete="off" required />
  <button type="submit" id="sendBtn">Send</button>
</form>
<script>
  const chatEl = document.getElementById("chat");
  const formEl = document.getElementById("chatForm");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const messages = [];

  function addBubble(role, text, extraClass) {
    const div = document.createElement("div");
    div.className = "msg " + role + (extraClass ? " " + extraClass : "");
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;

    messages.push({ role: "user", content: text });
    addBubble("user", text);
    inputEl.value = "";
    sendBtn.disabled = true;
    const pending = addBubble("assistant", "Thinking…", "pending");

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      pending.textContent = data.reply;
      pending.classList.remove("pending");
      messages.push({ role: "assistant", content: data.reply });
    } catch (err) {
      pending.textContent = "Error: " + err.message;
      pending.classList.remove("pending");
      pending.classList.add("error");
      messages.pop();
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  });
</script>
</body>
</html>
